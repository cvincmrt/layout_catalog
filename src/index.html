<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Catalog</title>
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="styles/index.scss"
    />
  </head>

  <body>
    <header class="header">
      <div class="container">
        <a
          href="#"
          class="logo"
        >

          />
        </a>

        <nav class="nav">
          <ul class="nav__list">
            <li class="nav__item">
              <a
                href="#apple"
                class="nav__link is-active"
              >

              </a>
            </li>
            <li class="nav__item">
              <a
                href="#samsung"
                class="nav__link"
              >
                samsung
              </a>
            </li>
            <li class="nav__item">
              <a
                href="#smartphones"
                class="nav__link"
              >
                smartphones
              </a>
            </li>
            <li
              class="nav__item"
              data-qa="nav-hover"
            >
              <a
                href="#laptops-computers"
                class="nav__link"
              >
                laptops & computers
              </a>
            </li>
            <li class="nav__item">
              <a
                href="#gadgets"
                class="nav__link"
              >
                gadgets
              </a>
            </li>
            <li class="nav__item">
              <a
                href="#tablets"
                class="nav__link"
              >
                tablets
              </a>
            </li>
            <li class="nav__item">
              <a
                href="#photo"
                class="nav__link"
              >
                photo
              </a>
            </li>
            <li class="nav__item">
              <a
                href="#video"
                class="nav__link"
              >
                video
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

</html>
